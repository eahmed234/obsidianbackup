# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: nabiwiki (السيرة)
  pageTitleSuffix: " | nabiwiki"
  enableSPA: false
  enablePopovers: true
  analytics: null
  locale: en-US
  baseUrl: eahmed234.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .git
    - .github
    - .quartz
    - public
    - GEMINI.md
    - CLAUDE.md
    - README.md
    - sources
    - review
    - .claude
    - rewrite-queue.sh
    - docs
    - ledger
    - audit.py
    - site_notice.py
    - site_nav.py
    - site_search.py
    - site_search.json
    - build.sh
    - patch-quartz.mjs
    - custom.scss
    - package.json
    - package-lock.json
    - node_modules
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Source Serif 4
      body: Source Serif 4
      # Quartz loads only these three families, so the interface font (Inter) rides in the "code" slot;
      # custom.scss gives code blocks their own monospace stack.
      code: Inter
    colors:
      lightMode:
        light: "#ffffff"
        lightgray: "#e3e5e8"
        gray: "#555b63"
        darkgray: "#1b1d1f"
        dark: "#1b1d1f"
        secondary: "#1d5c4d"
        tertiary: "#0d3229"
        highlight: "rgba(29, 92, 77, 0.10)"
        textHighlight: "rgba(29, 92, 77, 0.10)"
      darkMode:
        light: "#15171a"
        lightgray: "#2c3036"
        gray: "#a3a9b2"
        darkgray: "#e6e8eb"
        dark: "#e6e8eb"
        secondary: "#7cc7b0"
        tertiary: "#a6e0cd"
        highlight: "rgba(124, 199, 176, 0.14)"
        textHighlight: "rgba(124, 199, 176, 0.14)"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false
  - source: "@quartz-community/cname"
    enabled: false
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: false   # replaced by site_nav.py
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: false
    options:
      localGraph:
        drag: true
        zoom: true
        depth: 1
        scale: 1.0
        repelForce: 1.5
        centerForce: 0.2
        linkDistance: 60
        fontSize: 0.6
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: true
        enableRadial: false
      globalGraph:
        drag: true
        zoom: true
        depth: -1
        scale: 0.9
        repelForce: 1.2
        centerForce: 0.15
        linkDistance: 50
        fontSize: 0.6
        opacityScale: 1
        showTags: true
        removeTags: []
        focusOnHover: true
        enableRadial: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: false
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        "nabiwiki": "https://eahmed234.github.io"
        "GitHub": "https://github.com/eahmed234/obsidianbackup"
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: false   # replaced by site_nav.py
    options:
      includeAll: false
      includedProperties:
        - title
        - arabic
        - type
        - primary_source
        - location
        - date_hijri
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
